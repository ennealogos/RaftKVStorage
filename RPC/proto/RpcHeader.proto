syntax = "proto3";

package rpc;

message RpcRequestHeader {
    string service_name = 1;
    string method_name = 2;
    uint32 args_size = 3;
    uint64 request_id = 4;
}

message RpcResponseHeader {
    uint64 request_id = 1; // 对应的请求
    int32 error_code = 2;    // 错误码：0 = OK, 非 0 = 服务端错误
    string error_text = 3;   // 错误描述
}
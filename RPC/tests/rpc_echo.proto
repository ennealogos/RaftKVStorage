syntax = "proto3";

package rpctest;

option cc_generic_services = true;

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message SlowRequest {
  int32 delay_ms = 1;
}

message SlowResponse {
  string message = 1;
}

service SlowService {
  rpc Slow(SlowRequest) returns (SlowResponse);
}

message UnknownRequest {
  string message = 1;
}

message UnknownResponse {
  string message = 1;
}

// 不注册到 provider，用来验证 unknown service 错误响应
service UnknownService {
  rpc Call(UnknownRequest) returns (UnknownResponse);
}
